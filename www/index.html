<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>منحنى</title>
<style>
:root{--bg:#f6f4ee;--fg:#1c1b19;--mut:#b9b5a8;--acc:#d2542f;--dot:#000;--pn:#ebe8de}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eeece4;--mut:#4a4943;--acc:#ff8a63;--dot:#fff;--pn:#22211e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{display:flex;justify-content:space-between;padding:10px 16px;font-size:15px}
#c{flex:1;width:100%;min-height:0;touch-action:manipulation}
#bar{background:var(--pn);padding:10px 12px 14px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0}
button{font:inherit;border:1px solid var(--mut);background:var(--bg);color:var(--fg);border-radius:20px;padding:7px 16px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:flex;align-items:center;gap:8px;font-size:14px;width:100%}
input[type=range]{flex:1;accent-color:var(--acc)}
#hint{font-size:13px;color:var(--mut);text-align:center}
</style></head><body>
<div id="top"><span id="sc">النقاط: 0</span><span id="st"></span></div>
<canvas id="c"></canvas>
<div id="bar"><div class="row" id="modes"></div><div id="ctl"></div><div id="hint"></div></div>
<script>
const C=document.getElementById('c'),g=C.getContext('2d'),$=id=>document.getElementById(id);
let dpr=devicePixelRatio||1,col={};
function rs(){C.width=C.clientWidth*dpr;C.height=C.clientHeight*dpr;const s=getComputedStyle(document.documentElement);['bg','fg','mut','acc','dot'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
addEventListener('resize',rs);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',rs);
const CV=[
{f:x=>2.5*Math.sin(x)},
{f:x=>1.8*Math.sin(x)+1.2*Math.sin(2.5*x)},
{f:x=>x*x*x/40-x/2},
{f:x=>2*Math.sin(x)+(Math.floor(x/2)%2?1.5:-1.5),j:[-4,-2,0,2,4]},
{f:x=>((x%2)+2)%2*2-2+Math.sin(3*x)*.5,j:[-4,-2,0,2,4]}];
let mode='zen',ci=0,x=-6,spi=0,score=0,combo=0,A=1,B=1,ta=2,tb=1,hits={},solved=false,flash=0;
const SP=[1,2,.4],DG=[0,2,4,7,9];let ac;
function aud(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}
function tone(f,d=.35,v=.16,t='triangle'){if(!ac)return;const o=ac.createOscillator(),n=ac.createGain(),s=ac.currentTime;o.type=t;o.frequency.value=f;n.gain.setValueAtTime(0,s);n.gain.linearRampToValueAtTime(v,s+.02);n.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(n).connect(ac.destination);o.start(s);o.stop(s+d+.05)}
function fr(y){const i=Math.max(0,Math.min(14,Math.round((y+4)/8*14))),m=48+12*Math.floor(i/5)+DG[i%5];return 440*Math.pow(2,(m-69)/12)}
const F=v=>mode=='puzzle'?A*Math.sin(B*v):CV[ci].f(v);
function setMode(m){mode=m;spi=0;x=-6;hits={};combo=0;solved=false;
 if(m=='rhythm')ci=3+Math.floor(Math.random()*2);else if(m=='zen')ci=Math.floor(Math.random()*3);
 if(m=='puzzle')newPuz();ui()}
function newPuz(){ta=[1,1.5,2,2.5,3][Math.random()*5|0];tb=[.5,1,1.5,2][Math.random()*4|0];A=1;B=.3+Math.random()*0.1;solved=false}
function err(){let e=0;for(let i=0;i<41;i++){const v=-6+i*.3;e+=Math.abs(A*Math.sin(B*v)-ta*Math.sin(tb*v))}return e/41}
function ui(){
 $('modes').innerHTML=[['zen','استرخاء'],['puzzle','لغز'],['rhythm','إيقاع']].map(([k,n])=>`<button class="${k==mode?'on':''}" onclick="setMode('${k}')">${n}</button>`).join('');
 let h='',t='';
 if(mode=='zen'){h='<div class="row"><button onclick="ci=(ci+1)%3;x=-6">منحنى آخر</button></div>';t='المس الشاشة لتغيير السرعة'}
 if(mode=='puzzle'){h='<label>السعة <input type="range" min=".3" max="3.5" step=".05" value="'+A+'" oninput="A=+this.value;chk()"></label><label>التردد <input type="range" min=".3" max="2.5" step=".05" value="'+B+'" oninput="B=+this.value;chk()"></label>';t='طابق المنحنى الرمادي بتعديل المتغيرين'}
 if(mode=='rhythm')t='المس الشاشة لحظة قفز النقطة (الدوائر)';
 $('ctl').innerHTML=h;$('hint').textContent=t}
function chk(){if(!solved&&err()<.22){solved=true;score+=10;[0,4,7,12].forEach((s,i)=>setTimeout(()=>tone(261.6*Math.pow(2,s/12),.5),i*120));setTimeout(()=>{newPuz();ui()},1500)}}
C.addEventListener('pointerdown',()=>{aud();
 if(mode=='zen')spi=(spi+1)%3;
 if(mode=='rhythm'){let ok=false;for(const j of CV[ci].j)if(!hits[j]&&Math.abs(x-j)<.4){hits[j]=1;combo++;score+=10*combo;flash=1;ok=true;tone(fr(F(j))*2,.3,.25,'square');break}
  if(!ok){combo=0;tone(110,.2,.2,'sawtooth')}}});
function draw(){const w=C.width,h=C.height,X=v=>(v+6)/12*w,Y=v=>h-(v+4)/8*h;
 g.clearRect(0,0,w,h);g.lineWidth=dpr;g.strokeStyle=col.mut;g.globalAlpha=.35;g.beginPath();
 for(let i=-6;i<=6;i++){g.moveTo(X(i),0);g.lineTo(X(i),h)}for(let i=-4;i<=4;i++){g.moveTo(0,Y(i));g.lineTo(w,Y(i))}g.stroke();
 g.globalAlpha=1;g.strokeStyle=col.fg;g.lineWidth=1.5*dpr;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),h);g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.stroke();
 const path=(f,to)=>{g.beginPath();let p=null;for(let px=0;px<=to;px+=3*dpr){const v=-6+px/w*12,y=f(v);if(p!==null&&Math.abs(y-p)>2.5)g.moveTo(X(v),Y(y));else px?g.lineTo(X(v),Y(y)):g.moveTo(X(v),Y(y));p=y}g.stroke()};
 if(mode=='puzzle'){g.setLineDash([8*dpr,8*dpr]);g.strokeStyle=col.mut;g.lineWidth=3*dpr;path(v=>ta*Math.sin(tb*v),w);g.setLineDash([])}
 g.strokeStyle=col.acc;g.globalAlpha=.35;g.lineWidth=2*dpr;path(F,w);g.globalAlpha=1;g.lineWidth=3*dpr;path(F,(x+6)/12*w);
 if(mode=='rhythm')for(const j of CV[ci].j){g.strokeStyle=hits[j]==1?col.acc:col.fg;g.lineWidth=2*dpr;g.beginPath();g.arc(X(j),Y(F(j+.001)),14*dpr,0,7);g.stroke()}
 g.fillStyle=col.dot;g.beginPath();g.arc(X(x),Y(F(x)),9*dpr,0,7);g.fill();
 if(flash>0){g.strokeStyle=col.acc;g.lineWidth=3*dpr;g.beginPath();g.arc(X(x),Y(F(x)),(9+(1-flash)*30)*dpr,0,7);g.stroke();flash-=.06}
 $('sc').textContent='النقاط: '+score;
 $('st').textContent=mode=='rhythm'?'تتابع ×'+combo:mode=='puzzle'?(solved?'أحسنت!':'الفرق: '+err().toFixed(2)):'السرعة ×'+SP[spi]}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;const p=x;x+=1.6*SP[spi]*dt;
 if(x>6){x=-6;hits={}}
 else if(Math.floor(x/.5)!=Math.floor(p/.5))tone(fr(F(x)));
 if(mode=='rhythm')for(const j of CV[ci].j)if(x>j+.4&&!hits[j]){hits[j]=2;combo=0}
 draw();requestAnimationFrame(loop)}
rs();ui();requestAnimationFrame(loop);
</script></body></html>
